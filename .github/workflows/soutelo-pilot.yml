name: Soutelo pilot
on:
  push:
    branches: [codex/soutelo-pilot]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the application, migrate and seed a fresh MySQL database
        shell: bash
        run: |
          set -euo pipefail
          export PILOT_APP_KEY="base64:$(openssl rand -base64 32)"
          export PILOT_DB_PASSWORD="$(openssl rand -hex 24)"
          export PILOT_DB_ROOT_PASSWORD="$(openssl rand -hex 24)"
          export SOUTELO_PILOT_EMAIL=pilot@example.test
          export SOUTELO_PILOT_PASSWORD="$(openssl rand -hex 24)"
          export SOUTELO_PILOT_TOTP_SECRET="$(python3 -c 'import base64, secrets; print(base64.b32encode(secrets.token_bytes(20)).decode())')"
          export SOUTELO_PILOT_ACCOUNT_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PILOT_APP_KEY"
          echo "::add-mask::$PILOT_DB_PASSWORD"
          echo "::add-mask::$PILOT_DB_ROOT_PASSWORD"
          echo "::add-mask::$SOUTELO_PILOT_PASSWORD"
          echo "::add-mask::$SOUTELO_PILOT_TOTP_SECRET"
          echo "::add-mask::$SOUTELO_PILOT_ACCOUNT_PASSWORD"

          compose=(docker compose -f compose.pilot.yml)
          trap 'if [ "$?" -ne 0 ]; then "${compose[@]}" logs --no-color app; fi' EXIT
          "${compose[@]}" build app
          "${compose[@]}" run --rm --user www-data app php artisan migrate --force
          "${compose[@]}" run --rm --user www-data -e SOUTELO_PILOT_EMAIL -e SOUTELO_PILOT_PASSWORD -e SOUTELO_PILOT_TOTP_SECRET app php artisan db:seed --class=SouteloPilotSeeder --force
          for role in reception kitchen housekeeping; do
            "${compose[@]}" run --rm --user www-data -e SOUTELO_PILOT_ACCOUNT_PASSWORD app php artisan pilot:user "$role@example.test" --role="$role" --no-interaction
          done
          "${compose[@]}" up -d app
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8088/up -o /dev/null
          python3 tests/pilot_smoke.py
          "${compose[@]}" exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -N -e "SELECT COUNT(*) FROM soutelo_pilot.pilot_security_events WHERE action = \"reservations_exported\" AND actor_user_id IS NOT NULL"' | grep -qx '1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          test_dir="$(mktemp -d)"
          age-keygen -o "$test_dir/identity"
          export PILOT_BACKUP_RECIPIENT="$(age-keygen -y "$test_dir/identity")"
          printf 'pilot file restore test\n' | "${compose[@]}" exec -T --user www-data app sh -c 'cat > storage/app/private/pilot-restore.txt'
          backup="$(bash bin/pilot-backup "$test_dir")"
          "${compose[@]}" exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -e "CREATE DATABASE soutelo_restore"'
          age --decrypt -i "$test_dir/identity" "$backup/database.sql.age" \
            | "${compose[@]}" exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot soutelo_restore'
          "${compose[@]}" exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -N -e "SELECT COUNT(*) FROM soutelo_restore.participant"' | grep -qx '4'
          age --decrypt -i "$test_dir/identity" "$backup/files.tar.gz.age" \
            | tar -xOzf - ./private/pilot-restore.txt | grep -qx 'pilot file restore test'
          echo "Encrypted MySQL backup restored and private files archive verified."
