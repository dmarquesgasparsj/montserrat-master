name: soutelo-pilot

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: soutelo_pilot
      MYSQL_USER: soutelo
      MYSQL_PASSWORD: ${PILOT_DB_PASSWORD:?Define PILOT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PILOT_DB_ROOT_PASSWORD:?Define PILOT_DB_ROOT_PASSWORD}
    volumes:
      - pilot-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      APP_NAME: Casa da Torre
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${PILOT_APP_URL:-http://127.0.0.1:8088}
      APP_KEY: ${PILOT_APP_KEY:?Define PILOT_APP_KEY}
      APP_TIMEZONE: Europe/Lisbon
      APP_LOCALE: pt
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: soutelo_pilot
      DB_USERNAME: soutelo
      DB_PASSWORD: ${PILOT_DB_PASSWORD:?Define PILOT_DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
      SELF_NAME: Casa da Torre
      SELF_CONTACT_ID: "1"
      SOUTELO_PILOT: "true"
      SOUTELO_PILOT_TRUSTED_PROXY: ${PILOT_TRUSTED_PROXY:-}
    volumes:
      - pilot-files:/var/www/html/storage/app
    ports:
      - "127.0.0.1:${PILOT_PORT:-8088}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  pilot-mysql:
  pilot-files:
